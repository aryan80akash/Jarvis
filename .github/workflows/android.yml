
name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download project source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install Gradle 8.9 in GitHub cloud
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 4. Install Android SDK and accept licences
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      # 5. Explicitly accept remaining SDK licences
      - name: Accept Android SDK licences
        run: yes | sdkmanager --licenses

      # 6. Update and install required SDK packages
      - name: Install Android SDK packages
        run: |
          sdkmanager --update
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 7. Compile JARVIS APK
      - name: Build JARVIS APK
        run: gradle assembleDebug

      # 8. Upload APK for download
      - name: Upload JARVIS APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
